<body>

<div id="loader">
  <div class="ring"></div>
  <div class="txt">金 钻 墓 碑 图 集</div>
  <div class="pct" id="pct">载入中…</div>
</div>

<div id="topbar">
  <div class="title">金钻墓碑图集</div>
  <div class="sub">· 371 页 · 9 章</div>
  <select id="chap-jump"><option value="">章节…</option></select>
  <div class="spacer"></div>
  <button id="btn-first">封面</button>
  <button id="btn-prev">上一页</button>
  <button id="btn-next">下一页</button>
</div>

<div id="cover">
  <img class="cover-img" src="./assets/cover_001.jpg" alt="封面">
  <button class="enter-btn" type="button">进入图集</button>
</div>

<div id="flip-wrap">
  <div id="flipbook"></div>
</div>

<div id="footer">
  <span><b id="cur">-</b> / 371</span>
  <span class="hint">← → 翻页 · 拖拽翻页</span>
</div>

<script src="./jquery.min.js"></script>
<script src="./turn.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', async () => {
  const wrap    = document.getElementById('flipbook');
  const loader  = document.getElementById('loader');
  const curEl   = document.getElementById('cur');
  const chapJump= document.getElementById('chap-jump');
  const cover   = document.getElementById('cover');

  if (typeof window.jQuery === 'undefined' || typeof window.jQuery.fn.turn === 'undefined') {
    loader.innerHTML = '<div style="color:#d4af37;padding:20px;text-align:center;">翻页书启动失败</div>';
    return;
  }

  const pages = window.PAGES;
  const bodyPages = pages.filter(p => p.chapter > 0);
  const bodyTotal = bodyPages.length;

  // 章节下拉
  const chapGroup = {};
  bodyPages.forEach(p => { (chapGroup[p.chapter] = chapGroup[p.chapter] || []).push(p); });
  Object.entries(chapGroup).forEach(([cn, list]) => {
    const o = document.createElement('option');
    o.value = list[0].page;
    o.textContent = `第${cn}章`;
    chapJump.appendChild(o);
  });
  chapJump.addEventListener('change', e => { if (e.target.value) goTo(+e.target.value); });

  // 创建 page DOM（懒加载）
  bodyPages.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'page';
    div.dataset.page = p.page;
    const loading = i < 4 ? 'eager' : 'lazy';
    div.innerHTML =
      '<img src="./assets/' + p.src + '" ' +
      'alt="第' + p.page + '页" loading="' + loading + '" decoding="async">';
    wrap.appendChild(div);
  });

  // 移动端检测
  const isMobile = window.innerWidth < 900 || ('ontouchstart' in window && window.innerWidth < 1200);
  const PAGE_W = isMobile ? Math.min(window.innerWidth - 12, 700)
                           : Math.min((window.innerWidth - 60) / 2, 1100);
  const PAGE_H = PAGE_W * 2480 / 3508;
  wrap.style.width  = (isMobile ? PAGE_W : PAGE_W * 2) + 'px';
  wrap.style.height = PAGE_H + 'px';

  $('#flipbook').turn({
    width: isMobile ? PAGE_W : PAGE_W * 2,
    height: PAGE_H,
    autoCenter: true,
    display: isMobile ? 'single' : 'double',
    acceleration: true,
    elevation: 50,
    gradients: true,
    duration: 500,
    pages: bodyTotal,
    page: 1,
    when: {
      turned: (e, page) => {
        curEl.textContent = page;
      }
    }
  });

  const goTo = (p) => $('#flipbook').turn('page', p);

  document.querySelector('#cover .enter-btn').addEventListener('click', () => {
    cover.classList.add('hidden');
    goTo(1);
    curEl.textContent = 1;
  });

  document.getElementById('btn-first').onclick = () => {
    cover.classList.remove('hidden');
    curEl.textContent = '-';
  };
  document.getElementById('btn-prev').onclick = () => $('#flipbook').turn('previous');
  document.getElementById('btn-next').onclick = () => $('#flipbook').turn('next');

  // 触屏滑动翻页（向左滑=下一页，向右滑=上一页）
  let touchStartX = 0, touchStartY = 0;
  document.addEventListener('touchstart', (e) => {
    if (!cover.classList.contains('hidden')) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (!cover.classList.contains('hidden')) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) $('#flipbook').turn('next');
      else $('#flipbook').turn('previous');
    }
  }, { passive: true });

  curEl.textContent = '-';

  loader.classList.add('gone');
  setTimeout(() => loader.remove(), 500);
});
</script>
